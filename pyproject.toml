[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-demo-api"
version = "0.1.0"
description = "Production-grade FastAPI demo API with Docker deployment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
     "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
