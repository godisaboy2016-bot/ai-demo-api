name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Phase 1-3 · Setup, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - name: Phase 1 · Checkout
        uses: actions/checkout@v4

      - name: Phase 1 · Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Phase 2 · Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Phase 3 · Lint with ruff
        run: ruff check .

      - name: Phase 3 · Test with pytest
        run: python -m pytest

  docker:
    name: Phase 4 · Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Phase 4 · Checkout
        uses: actions/checkout@v4

      - name: Phase 4 · Build image
        run: docker build -t ai-demo-api:latest .
