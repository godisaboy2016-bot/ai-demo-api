services:
  db:
    image: postgres:16-alpine
    container_name: ai-demo-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_demo}
      POSTGRES_DB: ${POSTGRES_DB:-ai_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_demo} -d ${POSTGRES_DB:-ai_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build: .
    image: ai-demo-api:latest
    working_dir: /usr/local/lib/python3.12/site-packages/app/db
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ai_demo:ai_demo@db:5432/ai_demo}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # 迁移只依赖 DATABASE_URL；JWT_SECRET_KEY 继承 api 配置（若有）。
    # 未配置时生成一次性临时值，仅用于通过 Settings 校验，迁移过程不使用 JWT。
    command:
      - sh
      - -c
      - export JWT_SECRET_KEY="${JWT_SECRET_KEY:-$(python -c 'import secrets; print(secrets.token_hex(32))')}"; exec alembic -c alembic.ini upgrade head

  api:
    build: .
    image: ai-demo-api:latest
    container_name: ai-demo-api
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: production
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ai_demo:ai_demo@db:5432/ai_demo}
      # api 必须配置 JWT_SECRET_KEY（与 migrate 同一来源：shell 环境或 .env）。
      # 未配置时 compose 直接报错，避免容器启动后崩溃。
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (set it in .env or export it)}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
